[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-pcb"
version = "0.1.0"
description = "Fail-closed engineering foundation for an AI-assisted PCB workflow"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastembed>=0.5,<1",
    "httpx>=0.27,<1",
    "langgraph>=0.2,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "PyMuPDF>=1.24,<2",
    "PyYAML>=6.0,<7",
    "qdrant-client>=1.12,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
ai-pcb = "ai_pcb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_pcb"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires an external service such as a live Ollama server",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ai_pcb"]
