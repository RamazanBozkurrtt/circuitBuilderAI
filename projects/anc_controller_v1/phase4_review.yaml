independent_review:
  pass:
    - Typed IR rejects unknown pins and pins connected to more than one net.
    - Official ADSP-21569-family BSDL signal-ball map is hash pinned and parsed deterministically.
    - ADAU1978 and TAS6424-Q1 support 96 kHz TDM4 with 128-fS BCLK and 256-fS MCLK.
    - DSP is the only BCLK/FSYNC master; ADC and amplifier are slaves.
    - The selected oscillator is exact, 1.8 V, 24.576 MHz, and documented at 150 fs maximum RMS jitter.
    - The selected translator supports 1.8 V to 3.3 V operation well above 24.576 MHz.
    - ADP5054 500 kHz avoids the 1.0 V channel minimum-on-time problem at the 15.5 V input-envelope maximum.
  critical_unknown:
    - Generated child sheets do not contain electrically wired KiCad symbol instances; they contain hierarchy and typed-IR annotations only.
    - Full ADSP-21569 power and ground balls are still grouped placeholders and have not been expanded into the project-local symbol.
    - AFE passives, VREF buffer, input coupling, RF filter, ESD return strategy, and headroom cannot be approved without the microphone sensitivity and overload envelope.
    - ADP5054 compensation, bootstrap, low-side MOSFET, input/output capacitors, current-limit configuration, and sequence circuitry are absent.
    - Boot flash, boot straps, reset supervisor/gating, JTAG connector, and unused DSP pins are absent from the emitted sheets.
    - TAS6424-Q1 AREF, VREG, VCOM, AVDD, GVDD, bootstrap, PVDD bypass, output filters, snubbers, and speaker connectors are absent.
    - Regulated-input connector, fuse, reverse-polarity protection, and surge protection are not evidence-selected.
    - No KiCad installation is available, so the generated s-expression files were not parsed by kicad-cli; this is not reported as ERC.

readiness: BLOCKED
